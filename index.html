<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Klipku: editor video gratis di browser. Tanpa watermark, tanpa akun, video tidak diunggah.">
<title>Klipku – Editor Video Gratis</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c2410c">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
<h1>Klipku</h1>
<select id="ar" aria-label="Rasio layar"><option value="1280x720">16:9</option><option value="720x1280">9:16</option><option value="1080x1080">1:1</option><option value="1080x1350">4:5</option></select>
<button id="sv">Simpan</button><button id="ld">Buka</button><button id="exp" class="p">Ekspor</button>
<input id="file" type="file" accept="video/*,image/*" multiple hidden><input id="mf" type="file" accept="audio/*" multiple hidden><input id="of" type="file" accept="image/*" hidden>
</header>
<main class="pv"><canvas id="cv" width="1280" height="720"></canvas></main>
<div class="ctl"><span id="tm">0:00.0 / 0:00.0</span><button id="zo" class="ic" aria-label="Perkecil linimasa">−</button><button id="zi" class="ic" aria-label="Perbesar linimasa">+</button><button id="un" class="ic" aria-label="Urungkan">↶</button><button id="re" class="ic" aria-label="Ulangi">↷</button><button id="pl" class="ic p" aria-label="Putar atau jeda">▶</button></div>
<div id="twrap"><div id="phf"></div><div id="tw"><div class="rw" id="rw"></div></div><button id="imp" class="add" aria-label="Tambah video atau foto">+</button></div>
<nav id="tb">
<button id="tsp"><span>✂</span>Potong</button><button id="tdl"><span>✖</span>Hapus</button>
<button data-tab="edit"><span>✎</span>Edit</button><button data-tab="filter"><span>◐</span>Filter</button><button data-tab="efek"><span>✦</span>Efek</button><button data-tab="audio"><span>♪</span>Audio</button><button data-tab="teks"><span>T</span>Teks</button><button data-tab="overlay"><span>▣</span>Overlay</button>
</nav>
<div id="sheet"><div class="sh"><b id="stt">Edit</b><button id="sx">Selesai</button></div><aside id="in" data-tab="edit"></aside></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
