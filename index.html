<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Klipku: editor video gratis di browser. Tanpa watermark, tanpa akun, video tidak diunggah.">
<title>Klipku – Editor Video Gratis</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Klipku</h1>
<button id="imp">Tambah video</button>
<select id="ar" aria-label="Rasio layar" style="width:auto"><option value="1280x720">16:9</option><option value="720x1280">9:16</option><option value="1080x1080">1:1</option><option value="1080x1350">4:5</option></select><button id="sv">Simpan</button><button id="ld">Buka proyek</button><button id="un">Urungkan</button><button id="re">Ulangi</button><button id="exp" class="p">Ekspor</button><input id="mf" type="file" accept="audio/*" multiple hidden><input id="of" type="file" accept="image/*" hidden>
<input id="file" type="file" accept="video/*" multiple hidden>
</header>
<main>
<section>
<canvas id="cv" width="1280" height="720"></canvas>
<div class="bar"><button id="pl" aria-label="Putar atau jeda">Putar</button><span id="tm">0:00.0 / 0:00.0</span></div>
</section>
<aside class="pn" id="in"><h2>Pengaturan</h2><div class="em">Tambahkan video untuk mulai mengedit.</div></aside>
</main>
<div id="tw"><div class="rw" id="rw"><div class="em">Linimasa kosong. Pilih "Tambah video".</div></div></div>
<script src="app.js"></script>
</body>
</html>
